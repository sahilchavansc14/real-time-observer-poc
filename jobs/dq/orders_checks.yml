# Soda Core checks — Real-Time DQ Observability POC
# These run inside Spark Structured Streaming's foreachBatch over each micro-batch.
# Each micro-batch is scanned as a Spark DataFrame named "orders_batch".

checks for orders_batch:

  # -------- Completeness --------
  - missing_percent(customer_id) < 5:
      name: Completeness – customer_id null percentage under 5%
      attributes:
        dimension: completeness
        severity: warn
        rule_id: R-COMPL-001

  - missing_count(order_id) = 0:
      name: Completeness – order_id never null
      attributes:
        dimension: completeness
        severity: critical
        rule_id: R-COMPL-002

  - missing_count(amount) = 0:
      name: Completeness – amount never null
      attributes:
        dimension: completeness
        severity: critical
        rule_id: R-COMPL-003

  - missing_percent(email) < 5:
      name: Completeness – email null percentage under 5%
      attributes:
        dimension: completeness
        severity: warn
        rule_id: R-COMPL-004

  - missing_count(status) = 0:
      name: Completeness – status never null
      attributes:
        dimension: completeness
        severity: warn
        rule_id: R-COMPL-005

  # -------- Uniqueness --------
  - duplicate_count(order_id) = 0:
      name: Uniqueness – order_id unique within window
      attributes:
        dimension: uniqueness
        severity: critical
        rule_id: R-UNIQ-001

  # -------- Validity --------
  - invalid_percent(email) < 1:
      name: Validity – email format compliance
      valid format: email
      attributes:
        dimension: validity
        severity: warn
        rule_id: R-VALID-001

  - invalid_count(quantity) = 0:
      name: Validity – quantity must be positive integer (1–1000)
      valid min: 1
      valid max: 1000
      attributes:
        dimension: validity
        severity: warn
        rule_id: R-VALID-002

  - invalid_count(amount) = 0:
      name: Validity – amount must be positive
      valid min: 0.01
      attributes:
        dimension: validity
        severity: critical
        rule_id: R-VALID-003

  - invalid_count(currency) = 0:
      name: Validity – currency must be a known ISO code
      valid values: [USD, EUR, GBP, JPY, INR, CAD, AUD, CHF, SGD]
      attributes:
        dimension: validity
        severity: warn
        rule_id: R-VALID-004

  - invalid_count(status) = 0:
      name: Validity – order status must be an accepted value
      valid values: [CREATED, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
      attributes:
        dimension: validity
        severity: warn
        rule_id: R-VALID-005

  # -------- Volume --------
  - row_count > 0:
      name: Volume – batch is non-empty
      attributes:
        dimension: volume
        severity: critical
        rule_id: R-VOL-001

  # -------- Timeliness --------
  - freshness(event_time) < 10m:
      name: Timeliness – most recent event_time within 10 minutes
      attributes:
        dimension: timeliness
        severity: warn
        rule_id: R-TIME-001
