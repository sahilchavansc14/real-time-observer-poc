# ============================================================================
#  Real-Time Data Observability POC — Phase 0 (v2): Foundation
#  Services: Kafka (KRaft, no ZooKeeper), Schema Registry, Redpanda Console,
#            Spark Master, Spark Worker
#  Notes:
#    - Spark 4.0.2 (Scala 2.13, Java 17). Kafka connector coordinates below.
#    - Kafka runs in KRaft combined mode (broker + controller in one process).
#    - No Zookeeper. Future-proof for Kafka 4.x.
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Kafka (KRaft combined mode) — Apache upstream image, no Zookeeper.
  #   Listeners:
  #     PLAINTEXT      on :9092  → internal Docker network (kafka:9092)
  #     CONTROLLER     on :9093  → KRaft quorum, never exposed
  #     PLAINTEXT_HOST on :9094  → host-side access (localhost:9094)
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"   # host access only
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - observability-net

  # --------------------------------------------------------------------------
  # Schema Registry — shift-left DQ contract store.
  #   Still Confluent's image (the de-facto OSS Schema Registry);
  #   Apicurio is a valid alternative if you prefer fully Apache-licensed.
  # --------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - observability-net

  # --------------------------------------------------------------------------
  # Redpanda Console — replaces provectuslabs/kafka-ui.
  #   Better message viewer, native Schema Registry integration, cleaner UX.
  #   Config is injected as YAML via CONSOLE_CONFIG_FILE (official pattern).
  # --------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.1
    container_name: redpanda-console
    hostname: redpanda-console
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://schema-registry:8081"]
        server:
          listenPort: 8080
    networks:
      - observability-net

  # --------------------------------------------------------------------------
  # Spark Master (Apache upstream image, Spark 4.0.2, Python 3, Java 17)
  #   NOTE: apache/spark has no SPARK_MODE env shortcut — we invoke
  #         spark-class directly as the container command.
  # --------------------------------------------------------------------------
  spark-master:
    image: apache/spark:4.0.2-python3
    container_name: spark-master
    hostname: spark-master
    user: root                # POC simplification — drop this in prod
    ports:
      - "7077:7077"            # Spark master RPC
      - "8090:8080"            # Spark master web UI (8090 on host)
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host 0.0.0.0
      --port 7077
      --webui-port 8080
    volumes:
      - ./jobs:/opt/jobs                 # our PySpark code
      - ./jobs/dq:/opt/jobs/dq
      - spark-ivy-cache:/root/.ivy2      # cache Kafka connector jars
      - spark-checkpoints:/opt/checkpoints
    networks:
      - observability-net

  # --------------------------------------------------------------------------
  # Spark Worker
  # --------------------------------------------------------------------------
  spark-worker:
    image: apache/spark:4.0.2-python3
    container_name: spark-worker
    hostname: spark-worker
    user: root
    depends_on:
      - spark-master
    ports:
      - "8091:8081"            # worker web UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: "2G"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: "8081"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --webui-port 8081
      spark://spark-master:7077
    volumes:
      - ./jobs:/opt/jobs
      - spark-ivy-cache:/root/.ivy2
      - spark-checkpoints:/opt/checkpoints
    networks:
      - observability-net

  # --------------------------------------------------------------------------
  # Producer placeholder (Phase 1) — uncomment when we build the simulator
  # --------------------------------------------------------------------------
  # producer:
  #   build: ./producer
  #   container_name: producer
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     SCHEMA_REGISTRY_URL: http://schema-registry:8081
  #     TOPIC: orders_raw
  #   networks:
  #     - observability-net

  # ==========================================================================
  # Phase 3 additions — observability plane
  # Append these services to the existing services: block in docker-compose.yml.
  # The volumes: and networks: sections already exist; no changes needed there.
  # ==========================================================================

  obs-events-exporter:
    build: ./obs-consumer
    container_name: obs-events-exporter
    hostname: obs-events-exporter
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      OBS_TOPIC: observability_events
      GROUP_ID: obs-events-prometheus-exporter
      METRICS_PORT: "9108"
    ports:
      - "9108:9108"     # expose for curl debugging; Prometheus scrapes internally
    networks:
      - observability-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    hostname: prometheus
    depends_on:
      - obs-events-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    hostname: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin        # POC only — change for prod
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dq_overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability-net

volumes:
  kafka-data:
  spark-ivy-cache:
  spark-checkpoints:
  prometheus-data:
  grafana-data:

networks:
  observability-net:
    driver: bridge
    name: observability-net
